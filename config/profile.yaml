# پروفایل مهارتی — از صفحه‌ی «پروفایل» داشبورد ویرایش می‌شود.
# علامت ! اول یک کلمه یعنی حساس به حروف بزرگ (مثلا !GEO تا با geo-targeting قاطی نشود)
name: User
min_score: 45
report_top_n: 15
max_age_days: 7
per_source_limit: 60
skill_target: 25

skills:
  SEO:
    weight: 10
    aliases: [search engine optimization, search engine optimisation, organic search, سئو, سئوکار, بهینه سازی موتور جستجو]
  GEO / AI Search:
    weight: 10
    aliases: [generative engine optimization, "!GEO", جئو, answer engine optimization, "!AEO", LLM optimization, AI search, AI visibility, AI overviews, سئو هوش مصنوعی, نتایج هوش مصنوعی]
  SEO Strategy & Leadership:
    weight: 8
    aliases: [seo strategy, head of seo, seo manager, seo lead, مدیر سئو, سرپرست سئو, استراتژی سئو]
  Technical & On-page:
    weight: 6
    aliases: [technical seo, on-page, core web vitals, schema, سئو تکنیکال, سئو داخلی, سئو فنی]
  Off-page & Link Building:
    weight: 4
    aliases: [link building, backlinks, digital pr, لینک سازی, بک لینک, سئو خارجی]
  Search Console & Analytics:
    weight: 4
    aliases: [search console, "!GSC", google analytics, GA4, سرچ کنسول, گوگل آنالیتیکس]
  Keyword Research:
    weight: 4
    aliases: [ahrefs, semrush, screaming frog, keyword research, تحقیق کلمات کلیدی]
  WordPress / Ecommerce SEO:
    weight: 3
    aliases: [wordpress, woocommerce, rank math, yoast, وردپرس, ووکامرس, سئو فروشگاهی]


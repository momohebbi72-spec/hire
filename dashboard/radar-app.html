<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رادار فرصت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<style>
/* Light theme by design: the owner asked for a white dashboard. Dark tokens mirror it for OS dark mode. */
:root{
  color-scheme:light;
  --bg:#f5f6fb; --card:#ffffff; --card2:#fafbfe; --side:#ffffff;
  --ink:#0d1226; --ink2:#394063; --muted:#6c7294; --faint:#a0a5bf;
  --line:#e8eaf3; --line2:#dadded; --hover:#f3f4fb;
  --accent:#4f46e5; --accent2:#4338ca; --accent-soft:#eef0ff; --accent-line:#d7dbff;
  --good:#067647; --good-soft:#e8f7ef; --good-line:#bfe8d2;
  --warn:#a15c07; --warn-soft:#fff6e5; --warn-line:#fbe0ad;
  --bad:#c0362c; --bad-soft:#fdeeec;
  --p-bg:#eef4ff; --p-ink:#1d5fbf; --g-bg:#f3eeff; --g-ink:#6b3fd4; --money-bg:#eefaf3; --money-ink:#0c6b3f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --o1:#86b6ef; --o2:#3987e5; --o3:#256abf; --o4:#104281;
  --grid:#e1e0d9;
  --shadow:0 1px 2px rgba(16,24,64,.04),0 2px 8px rgba(16,24,64,.04);
  --shadow2:0 10px 30px rgba(16,24,64,.10),0 2px 6px rgba(16,24,64,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f111a; --card:#171a26; --card2:#1b1f2d; --side:#141722;
    --ink:#f3f4fa; --ink2:#c9cce0; --muted:#9398b5; --faint:#6b7090;
    --line:#262a3b; --line2:#30354a; --hover:#1f2332;
    --accent:#8b85ff; --accent2:#a39eff; --accent-soft:#232446; --accent-line:#34366a;
    --good:#3fd18b; --good-soft:#12291f; --good-line:#1d4a35;
    --warn:#f0b24a; --warn-soft:#2c2413; --warn-line:#4d3d18;
    --bad:#ff7b72; --bad-soft:#2d1716;
    --p-bg:#1a2640; --p-ink:#8fb6f3; --g-bg:#261d40; --g-ink:#b9a2f5; --money-bg:#12291f; --money-ink:#6ad7a1;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --o1:#184f95; --o2:#256abf; --o3:#3987e5; --o4:#86b6ef;
    --grid:#2c2c2a;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f111a; --card:#171a26; --card2:#1b1f2d; --side:#141722;
  --ink:#f3f4fa; --ink2:#c9cce0; --muted:#9398b5; --faint:#6b7090;
  --line:#262a3b; --line2:#30354a; --hover:#1f2332;
  --accent:#8b85ff; --accent2:#a39eff; --accent-soft:#232446; --accent-line:#34366a;
  --good:#3fd18b; --good-soft:#12291f; --good-line:#1d4a35;
  --warn:#f0b24a; --warn-soft:#2c2413; --warn-line:#4d3d18;
  --bad:#ff7b72; --bad-soft:#2d1716;
  --p-bg:#1a2640; --p-ink:#8fb6f3; --g-bg:#261d40; --g-ink:#b9a2f5; --money-bg:#12291f; --money-ink:#6ad7a1;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --o1:#184f95; --o2:#256abf; --o3:#3987e5; --o4:#86b6ef;
  --grid:#2c2c2a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.7 Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;z-index:30;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6d5efc,#4f46e5 55%,#2a78d6);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35);flex:none}
.logo svg{width:22px;height:22px}
.brand b{font-size:16px;font-weight:800;display:block;line-height:1.3}
.brand small{color:var(--muted);font-size:11.5px}
.navgrp{font-size:11px;font-weight:700;color:var(--faint);padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink2);font-weight:600;cursor:pointer;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a.on::before{content:"";position:absolute;right:-14px;top:9px;bottom:9px;width:3px;border-radius:3px 0 0 3px;background:var(--accent)}
.nav a .cnt{margin-inline-start:auto;font-size:11.5px;font-weight:700;min-width:24px;height:21px;padding:0 7px;border-radius:20px;background:var(--hover);color:var(--muted);display:grid;place-items:center}
.nav a.on .cnt{background:var(--card);color:var(--accent)}
.nav a .cnt.warn{background:var(--warn-soft);color:var(--warn)}
.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card2);font-size:12px;color:var(--muted)}
.side-foot .row{display:flex;justify-content:space-between;gap:8px}
.side-foot b{color:var(--ink2);font-weight:600}
.side-foot .btn{width:100%;justify-content:center;margin-top:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-size:19px;font-weight:800;line-height:1.35}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1;min-width:0}
.search{position:relative;width:min(340px,38vw)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:17px;height:17px}
.search input{width:100%;height:40px;border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:0 38px 0 12px;outline:none;transition:border .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.winpill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:11px;background:var(--card);border:1px solid var(--line2);color:var(--ink2);font-weight:600;font-size:12.5px;white-space:nowrap}
.winpill svg{width:16px;height:16px;color:var(--accent)}
.menu-btn{display:none}
.content{padding:24px 28px 60px;max-width:1440px;width:100%}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn:focus-visible,.ibtn:focus-visible,.nav a:focus-visible,.job:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn.on{color:var(--accent);background:var(--accent-soft)}
.ibtn.on svg{fill:currentColor}
select.sel{height:36px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:0 10px;cursor:pointer}
input.inp,textarea.inp{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:9px 12px;outline:none}
input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:190px;resize:vertical;line-height:1.9}
.msg{font-size:12.5px;color:var(--muted);min-height:20px;margin-top:8px}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}

/* checkbox */
.chk{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;user-select:none;font-size:13.5px;color:var(--ink2);position:relative}
.chk:hover{background:var(--hover)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:18px;height:18px;border-radius:5px;border:1.6px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--card);transition:all .12s}
.chk .box svg{width:12px;height:12px;stroke-width:3;color:#fff;opacity:0}
.chk input:checked+.box{background:var(--accent);border-color:var(--accent)}
.chk input:checked+.box svg{opacity:1}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.chk .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.chk.dim{opacity:.45}

/* switch */
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0}
.sw .tr{width:40px;height:23px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+.tr{background:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(-17px)}
.sw input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.sw .tx b{display:block;font-weight:600;color:var(--ink)}
.sw .tx small{color:var(--muted);font-size:12px}

/* ---------- cards / panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.panel h2{margin:0;font-size:15px;font-weight:800}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel .ph .sub{color:var(--muted);font-size:12.5px}
.panel .ph .grow{flex:1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:1.35fr repeat(4,1fr)}
.g-2{grid-template-columns:1.4fr 1fr}

.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi .val{font-size:30px;font-weight:800;line-height:1.25;margin-top:4px}
.kpi .hint{color:var(--faint);font-size:12px}
.kpi.hero{background:linear-gradient(140deg,#4f46e5,#5b4ff0 45%,#2a78d6);color:#fff;border:0}
.kpi.hero .lbl,.kpi.hero .hint{color:rgba(255,255,255,.85)}
.kpi.hero .val{font-size:52px;line-height:1.1;margin-top:6px}
.kpi.hero::after{content:"";position:absolute;left:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.kpi.link{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi.link:hover{border-color:var(--accent-line);transform:translateY(-1px)}

/* columns chart */
.cols{display:flex;align-items:flex-end;gap:10px;height:190px;padding:18px 30px 0 4px;border-bottom:1px solid var(--grid);position:relative}
.cols .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid);pointer-events:none}
.cols .gl span{position:absolute;right:0;top:-9px;font-size:10.5px;color:var(--faint);background:var(--card);padding-left:4px;font-variant-numeric:tabular-nums}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:1}
.col .stk{width:22px;display:flex;flex-direction:column-reverse;gap:2px}
.col .stk i{display:block;width:100%;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.col .stk i:last-child{border-radius:4px 4px 0 0}
.col .tot{font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:10px;padding:6px 30px 0 4px}
.xl span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* horizontal bars */
.hb{display:grid;gap:11px}
.hb .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.hb .k{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.hb .t{grid-column:1/-1;height:10px;border-radius:4px;background:var(--hover);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:0 4px 4px 0;border-radius:4px 0 0 4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.stack{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden;margin-top:6px}
.stack i{display:block;height:100%}

.funnel{display:grid;gap:9px}
.funnel .r{display:grid;grid-template-columns:100px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.funnel .t{height:22px;background:var(--hover);border-radius:6px;overflow:hidden}
.funnel .t i{display:block;height:100%;border-radius:6px;transition:width .6s}
.funnel .v{font-weight:700;text-align:left;font-variant-numeric:tabular-nums}

/* ---------- feed layout ---------- */
.feed{display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
.fpanel{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);scrollbar-width:thin}
.fpanel .fh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.fpanel .fh b{font-weight:800;display:flex;align-items:center;gap:7px}
.fpanel .fh .grow{flex:1}
.fpanel .fh button{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px}
.fg{border-bottom:1px solid var(--line);padding:6px 10px 10px}
.fg:last-child{border-bottom:0}
.fg summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 6px 6px;font-weight:700;font-size:13.5px;cursor:pointer}
.fg summary::-webkit-details-marker{display:none}
.fg summary svg{width:16px;height:16px;color:var(--faint);transition:transform .15s}
.fg[open] summary svg{transform:rotate(180deg)}
.fg .more{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px}
.fg .fs{margin:4px 0 6px}
.fg .fs input{height:34px;font-size:13px}

.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhead .cnt{font-weight:800;font-size:15px}
.rhead .cnt small{color:var(--muted);font-weight:500;font-size:12.5px;margin-inline-start:6px}
.rhead .grow{flex:1}
.fbtn{display:none!important}
.applied{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.achip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:30px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;border:1px solid var(--accent-line);cursor:pointer}
.achip svg{width:14px;height:14px}
.achip.clear{background:transparent;border-color:transparent;color:var(--muted);padding:0 10px}

.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;box-shadow:var(--shadow)}
.job:hover{border-color:var(--accent-line);box-shadow:var(--shadow2);transform:translateY(-1px)}
.job.seen .jt{color:var(--ink2);font-weight:600}
.av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.jt{font-size:15.5px;font-weight:700;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}
.jm{color:var(--muted);font-size:12.8px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.jm span{display:inline-flex;align-items:center;gap:5px}
.jm svg{width:14px;height:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:7px;background:var(--hover);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag svg{width:13px;height:13px}
.tag.m{background:var(--good-soft);color:var(--good)}
.tag.p{background:var(--p-bg);color:var(--p-ink)}
.tag.g{background:var(--g-bg);color:var(--g-ink)}
.tag.s{background:var(--accent-soft);color:var(--accent)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.money{background:var(--money-bg);color:var(--money-ink)}
.why{margin-top:10px;display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);padding:8px 11px;border-radius:9px;font-size:12.5px;font-weight:600}
.why svg{width:15px;height:15px;margin-top:3px}
.ja{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.age{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.age svg{width:14px;height:14px}
.age.new{color:var(--good);font-weight:700}
.acts{display:flex;gap:2px}
.stpill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.showmore{display:flex;justify-content:center;margin-top:14px}

.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:44px 24px;text-align:center;color:var(--muted)}
.empty .ei{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.empty .ei svg{width:26px;height:26px}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.empty .btn{margin-top:14px}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.banner .bi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.banner b{display:block}
.banner p{margin:2px 0 0;color:var(--muted);font-size:13px}
.banner.warn .bi{background:var(--warn-soft);color:var(--warn)}
.banner.info .bi{background:var(--accent-soft);color:var(--accent)}

.mini{display:grid;gap:2px}
.mini .it{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer}
.mini .it:hover{background:var(--hover)}

.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:280px}

.kcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--accent-line)}
.kcard b{display:block;font-size:13.5px;line-height:1.55}
.kcard small{color:var(--muted);font-size:12px}

/* ---------- settings ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}

.tabs button:hover{color:var(--ink)}
.set{display:grid;gap:16px;max-width:1060px}
.set .panel p.d{margin:4px 0 12px;color:var(--muted);font-size:13px}

.tagbox .t button svg{width:13px;height:13px}
.tagbox input{border:0;outline:0;flex:1;min-width:140px;background:transparent;height:28px;font-size:13px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.src{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card2);cursor:pointer;position:relative}
.src:hover{border-color:var(--line2)}
.src .av{width:36px;height:36px;font-size:14px;border-radius:10px}
.src .tx{flex:1;min-width:0}
.src .tx b{display:block;font-size:13.5px}
.src .tx small{color:var(--muted);font-size:11.5px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  .two{grid-template-columns:1fr}

  (async function boot() {

    if (!window.claude || !window.claude.use) return fatal("این صفحه داده‌هایش را از Claude می‌خواند؛ از داخل claude.ai یا نسخه‌ی مک بازش کن.");
    var db = await window.claude.use("db");
    S.db = db;
    if (!db) return fatal("پایگاه داده در این نما در دسترس نیست. صفحه را از داخل claude.ai باز کن.");
    var pending = 2;
    function ready() { if (--pending <= 0 && !S.loaded) { S.loaded = true; reclassify(); render(); } }
    function failed() { fatal("اتصال به داده‌ها قطع شد؛ صفحه را دوباره باز کن."); }
    function refresh() {
      if (!S.loaded) return;
      renderNav(); renderTop();
      var ae = document.activeElement, typing = ae && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName) && ae.id !== "q" && !(ae.dataset && ae.dataset.facet);
      if (!typing && S.view !== "settings") renderView();
      if (S.openId && !typing) openDrawer(S.openId);
    }
    db.collection("feed").onSnapshot(function (snap) {
      var items = {};
      snap.docs.forEach(function (d) { var b = d.data() || {}; (b.items || []).forEach(function (o) { if (o && o.id && o.ch) items[o.id] = o; }); });
      S.items = items; reclassify(); if (S.loaded) refresh(); else ready();
    }, failed);
    db.collection("status").onSnapshot(function (snap) {
      var st = {}; snap.docs.forEach(function (d) { st[d.id] = d.data() || {}; });
      S.status = st; if (S.loaded) refresh(); else ready();
    }, failed);
    db.doc("config/meta").onSnapshot(function (d) { S.meta = d.exists ? d.data() : null; renderNav(); });
    db.doc("config/rules").onSnapshot(function (d) {
      if (d.exists) { S.rules = Object.assign(clone(DEFAULT_RULES), d.data()); reclassify(); if (S.loaded && S.view !== "settings") refresh(); else if (S.loaded) { renderNav(); renderTop(); } }
    });
    db.doc("config/sources").onSnapshot(function (d) {
      if (!d.exists) return;
      var x = d.data(); S.sources = Object.assign(clone(DEFAULT_SOURCES), x);
      S.sources.iran = Object.assign(clone(DEFAULT_SOURCES.iran), x.iran || {}); S.sources.foreign = Object.assign(clone(DEFAULT_SOURCES.foreign), x.foreign || {});
      (x.sites || []).forEach(function (dmn, i) { if (!S.sources.custom.some(function (c) { return hostOf(c.url) === hostOf(dmn); })) S.sources.custom.push({ id: "m" + i, name: hostOf(dmn), url: "https://" + hostOf(dmn), region: "iran", enabled: true }); });
      S.sources.sites = []; reclassify(); if (S.loaded && S.view !== "settings") refresh();
    });
    db.doc("config/fields").onSnapshot(function (d) {
      if (!d.exists) return;
      S.fields = Object.assign(clone(DEFAULT_FIELDS), d.data()); reclassify();
      if (S.loaded && S.view !== "settings") refresh();
    });
    db.doc("config/report").onSnapshot(function (d) { if (d.exists) S.report = Object.assign(clone(DEFAULT_REPORT), d.data()); });
    db.doc("config/templates").onSnapshot(function (d) { if (d.exists) { var t = d.data(); S.templates = { fa: t.fa || DEFAULT_TEMPLATES.fa, en: t.en || DEFAULT_TEMPLATES.en }; } });
    db.doc("config/resume").onSnapshot(function (d) { S.resume = d.exists ? d.data() : null; if (S.loaded && S.view === "settings" && S.setTab === "texts") renderView(); });
    window.claude.use("sample").then(function (s) { caps.sample = s; }).catch(function () {});
    window.claude.use("assets").then(function (a) { caps.assets = a; }).catch(function () {});
    window.claude.use("mcp").then(function (m) { caps.mcp = m; renderNav(); }).catch(function () {});
  })();
})();
</script>

<title>رادار فرصت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f7f7fc; --raised:#ffffff; --ink:#15162b; --ink2:#3b3d5c; --muted:#6a6d89;
  --line:#e6e6f1; --accent:#4338ca; --accent-soft:#eef0ff; --accent-ink:#ffffff;
  --good:#15803d; --good-soft:#e3f6ea; --warn:#a35a04; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fde8e6;
  --shadow:0 1px 2px rgba(21,22,43,.05),0 6px 20px rgba(21,22,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0f1d; --surface:#151731; --raised:#1a1c3a; --ink:#ecedf8; --ink2:#c9cae3; --muted:#9a9cba;
    --line:#2a2c4d; --accent:#8e90ff; --accent-soft:#23265a; --accent-ink:#0e0f1d;
    --good:#4ade80; --good-soft:#12301f; --warn:#f5b454; --warn-soft:#3a2a10; --bad:#f87171; --bad-soft:#3a1616;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f1d; --surface:#151731; --raised:#1a1c3a; --ink:#ecedf8; --ink2:#c9cae3; --muted:#9a9cba;
  --line:#2a2c4d; --accent:#8e90ff; --accent-soft:#23265a; --accent-ink:#0e0f1d;
  --good:#4ade80; --good-soft:#12301f; --warn:#f5b454; --warn-soft:#3a2a10; --bad:#f87171; --bad-soft:#3a1616;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.75;direction:rtl}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
h1{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.small{padding:3px 10px;font-size:13px;border-radius:8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.accent{background:var(--accent-soft)} .kpi.accent b{color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;background:var(--surface);border-radius:99px;padding:0 7px;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border-radius:12px;padding:10px;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px}
.bar input,.bar select{border:1px solid var(--line);background:var(--raised);border-radius:9px;padding:6px 10px;font-size:14px}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card.dim{opacity:.55}
.score{width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);direction:ltr}
.score b{font-size:20px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.score small{font-size:10px;margin-top:3px}
.score.hi{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)}
.ttl{font-size:16px;font-weight:700;margin:0;line-height:1.6;overflow-wrap:anywhere}
.ttl a{color:var(--ink);text-decoration:none} .ttl a:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--surface);color:var(--ink2);white-space:nowrap}
.tag.why{background:var(--good-soft);color:var(--good)} .tag.neg{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:13px;color:var(--ink2);margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.spacer{flex:1}
.pill{font-size:12px;border-radius:99px;padding:1px 10px;background:var(--surface);color:var(--ink2)}
.pill.New{background:var(--accent-soft);color:var(--accent)} .pill.Won{background:var(--good-soft);color:var(--good)}
.pill.Contacted,.pill.Applied{background:var(--warn-soft);color:var(--warn)}
.notes{margin-top:8px;display:flex;gap:6px}
.notes textarea{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 10px;min-height:38px;resize:vertical}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--muted)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 6px}
.panel p{margin:0 0 10px;color:var(--ink2);font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
.field textarea,.field input,.field select{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;color:var(--ink);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--surface);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}
.mini{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.mini a{color:var(--ink);text-decoration:none;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,10,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:10;overflow-y:auto}
.modal{background:var(--raised);border-radius:16px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal textarea{width:100%;min-height:220px}
.msg{font-size:13px;margin-top:8px;color:var(--ink2)}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;z-index:20;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.card:hover{border-color:var(--accent-soft)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9" opacity=".5"/><circle cx="12" cy="12" r="5" opacity=".8"/><path d="M12 12 L19 6" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="#fff" stroke="none"/></svg></div>
      <div><h1>رادار فرصت</h1><div class="sub" id="lastRun">در حال بارگذاری…</div></div>
    </div>
    <div class="acts" style="margin:0">
      <button class="btn" id="scanBtn" type="button" hidden>اسکن الان</button>
      <span class="msg" id="scanMsg"></span>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="view"><div class="empty">در حال بارگذاری فرصت‌ها…</div></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var TRIGGER_ID = "trig_01HhFw5wQq1oRaCsE3GEr7VZ";
  var STATUSES = ["New", "Saved", "Contacted", "Applied", "Won", "Rejected", "Ignored"];
  var STATUS_FA = { New: "جدید", Saved: "ذخیره‌شده", Contacted: "پیام دادم", Applied: "اپلای کردم", Won: "موفق", Rejected: "رد شد", Ignored: "نادیده" };
  var QUICK = [["Saved", "ذخیره"], ["Contacted", "پیام دادم"], ["Applied", "اپلای کردم"], ["Ignored", "نادیده"]];
  var DEFAULT_TEMPLATES = {
    fa: "سلام، وقت بخیر\n\nآگهی «{title}» در {company} را دیدم و علاقه‌مند به همکاری هستم.\nتخصص من سئو و دیجیتال مارکتینگ است: سئو تکنیکال، تحقیق کلمات کلیدی، سرچ کنسول و GA4، وردپرس، تولید محتوای سئو‌محور و بهینه‌سازی برای موتورهای هوش مصنوعی (GEO).\n\nرزومه‌ام را پیوست کرده‌ام. اگر مایل باشید، خوشحال می‌شوم در یک گفتگوی کوتاه بیشتر توضیح بدهم.\n\nبا احترام\n[نام و نام خانوادگی]\n[شماره تماس]",
    en: "Hi,\n\nI came across the {title} role at {company} and would love to be considered.\nI work in SEO and digital marketing: technical SEO, keyword research, Google Search Console and GA4, WordPress, content strategy, and optimisation for AI search (GEO/AEO). I work remotely and am comfortable with async collaboration across time zones.\n\nMy CV is attached. I'd be glad to share examples of results on a short call.\n\nBest regards,\n[Your name]\n[LinkedIn profile]"
  };
  var DEFAULT_FILTERS = { mustAny: [], exclude: [], cities: [], remoteOnly: false, types: [], minScore: 0 };

  var S = {
    items: {}, chunks: {}, status: {}, filters: clone(DEFAULT_FILTERS), templates: clone(DEFAULT_TEMPLATES),
    resume: null, meta: null, loaded: false, db: null,
    tab: ls("tab", "iran"),
    ui: { q: "", minScore: 40, type: "all", mode: "all", days: "all", st: "active", sort: "score", mine: ls("mine", "1") === "1", friendly: ls("friendly", "0") === "1" }
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function ls(k, d) { try { var v = localStorage.getItem("radar." + k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem("radar." + k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function norm(s) { return String(s || "").toLowerCase().replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/‌/g, " "); }
  function $(id) { return document.getElementById(id); }
  var faNum = new Intl.NumberFormat("fa-IR");
  var faDate = new Intl.DateTimeFormat("fa-IR", { month: "long", day: "numeric" });
  var faDateTime = new Intl.DateTimeFormat("fa-IR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
  function toDate(s) { if (!s) return null; var d = new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z"); return isNaN(d) ? null : d; }
  function fdate(s) { var d = toDate(s); return d ? faDate.format(d) : ""; }

  function toast(text) { var t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3200); }

  // ---------------------------------------------------------------- data
  function statusOf(id) { return (S.status[id] && S.status[id].status) || "New"; }
  function notesOf(id) { return (S.status[id] && S.status[id].notes) || ""; }
  function all() { return Object.keys(S.items).map(function (k) { return S.items[k]; }); }
  function isFriendly(o) { return /linkedin|freelancer|reddit|upwork|wellfound/i.test(o.source + " " + o.url); }
  function iranLinked(o) { return /iran|persian|farsi|tehran/i.test(o.title + " " + o.desc + " " + o.company); }

  function matchesMine(o) {
    var f = S.filters, text = norm([o.title, o.desc, o.company, o.location, o.source].join(" "));
    if (f.exclude.some(function (k) { return k && text.indexOf(norm(k)) > -1; })) return false;
    if (f.mustAny.length && !f.mustAny.some(function (k) { return k && text.indexOf(norm(k)) > -1; })) return false;
    if (f.remoteOnly && o.remote !== "Remote") return false;
    if (f.cities.length && o.remote !== "Remote" && !f.cities.some(function (c) { return c && text.indexOf(norm(c)) > -1; })) return false;
    if (f.types.length && f.types.indexOf(o.type === "Freelance" ? "freelance" : "job") === -1) return false;
    if (f.minScore && o.score < f.minScore) return false;
    return true;
  }

  function visible(region) {
    var u = S.ui, q = norm(u.q), now = Date.now();
    var days = { "1": 1, "3": 3, "7": 7, "30": 30 }[u.days];
    var rows = all().filter(function (o) {
      if (o.region !== region) return false;
      var st = statusOf(o.id);
      if (u.st === "active" && (st === "Ignored" || st === "Rejected")) return false;
      if (u.st !== "active" && u.st !== "all" && st !== u.st) return false;
      if (o.score < u.minScore) return false;
      if (u.type === "freelance" && o.type !== "Freelance") return false;
      if (u.type === "job" && o.type === "Freelance") return false;
      if (u.mode !== "all" && o.remote !== u.mode) return false;
      if (days) { var d = toDate(o.found); if (!d || now - d.getTime() > days * 864e5) return false; }
      if (region === "intl" && u.friendly && !isFriendly(o) && !iranLinked(o)) return false;
      if (u.mine && !matchesMine(o)) return false;
      if (q && norm([o.title, o.company, o.desc, o.location, notesOf(o.id)].join(" ")).indexOf(q) === -1) return false;
      return true;
    });
    rows.sort(u.sort === "new"
      ? function (a, b) { return (b.found || "").localeCompare(a.found || "") || b.score - a.score; }
      : function (a, b) { return b.score - a.score || (b.found || "").localeCompare(a.found || ""); });
    return rows;
  }

  // -------------------------------------------------------------- render
  function renderAll() { renderHeader(); renderSummary(); renderTabs(); renderView(); }

  function renderHeader() {
    var m = S.meta;
    $("lastRun").textContent = !S.loaded ? "در حال بارگذاری…" :
      m && m.lastRun ? "آخرین به‌روزرسانی: " + faDateTime.format(toDate(m.lastRun)) + " · هر ۴۸ ساعت خودکار" : "هنوز داده‌ای ثبت نشده";
  }

  function renderSummary() {
    var items = all(), iran = 0, strongIran = 0, intl = 0, active = 0;
    items.forEach(function (o) {
      var st = statusOf(o.id);
      if (o.region === "iran") { iran++; if (o.score >= 55 && st === "New") strongIran++; } else intl++;
      if (st === "Contacted" || st === "Applied") active++;
    });
    $("summary").innerHTML =
      kpi(faNum.format(strongIran), "فرصت قوی ایرانی بررسی‌نشده", "accent") +
      kpi(faNum.format(iran), "کل آگهی‌های ایرانی") +
      kpi(faNum.format(intl), "آگهی‌های خارجی") +
      kpi(faNum.format(active), "در جریان (پیام/اپلای)");
  }
  function kpi(v, l, cls) { return '<div class="kpi ' + (cls || "") + '"><b>' + v + "</b><span>" + l + "</span></div>"; }

  function renderTabs() {
    var counts = { iran: visibleCount("iran"), intl: visibleCount("intl") };
    var pipe = all().filter(function (o) { var s = statusOf(o.id); return s !== "New" && s !== "Ignored"; }).length;
    var tabs = [["iran", "ایران", counts.iran], ["intl", "خارجی", counts.intl], ["pipe", "پیگیری", pipe], ["texts", "متن‌ها و رزومه"], ["filters", "فیلترهای من"]];
    $("tabs").innerHTML = tabs.map(function (t) {
      return '<button class="tab ' + (S.tab === t[0] ? "on" : "") + '" role="tab" type="button" data-tab="' + t[0] + '">' + t[1] +
        (t[2] != null ? '<span class="n">' + faNum.format(t[2]) + "</span>" : "") + "</button>";
    }).join("");
  }
  function visibleCount(r) { return visible(r).length; }

  function renderView() {
    var v = $("view");
    if (!S.loaded) { v.innerHTML = '<div class="empty">در حال بارگذاری فرصت‌ها…</div>'; return; }
    if (S.tab === "iran" || S.tab === "intl") v.innerHTML = feedHtml(S.tab);
    else if (S.tab === "pipe") v.innerHTML = pipeHtml();
    else if (S.tab === "texts") v.innerHTML = textsHtml();
    else v.innerHTML = filtersHtml();
  }

  function sel(id, value, opts) {
    return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === value ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select>";
  }

  function feedHtml(region) {
    var u = S.ui, rows = visible(region);
    var bar = '<div class="bar">' +
      '<input type="search" id="q" placeholder="جستجو در عنوان، شرکت، شهر، یادداشت…" value="' + esc(u.q) + '">' +
      '<label>حداقل امتیاز <input type="number" id="minScore" min="0" max="100" step="5" value="' + u.minScore + '" style="width:72px"></label>' +
      sel("type", u.type, [["all", "همه‌ی انواع"], ["job", "استخدام"], ["freelance", "پروژه فریلنس"]]) +
      sel("mode", u.mode, [["all", "دورکاری و حضوری"], ["Remote", "فقط دورکاری"], ["On-site", "حضوری"], ["Hybrid", "هیبرید"]]) +
      sel("days", u.days, [["all", "هر زمان"], ["1", "۲۴ ساعت اخیر"], ["3", "۳ روز اخیر"], ["7", "هفته‌ی اخیر"], ["30", "ماه اخیر"]]) +
      sel("st", u.st, [["active", "فعال (بدون نادیده/رد)"], ["all", "همه‌ی وضعیت‌ها"]].concat(STATUSES.map(function (s) { return [s, STATUS_FA[s]]; }))) +
      sel("sort", u.sort, [["score", "بیشترین تطابق"], ["new", "جدیدترین"]]) +
      '<label><input type="checkbox" id="mine"' + (u.mine ? " checked" : "") + '> فیلترهای من</label>' +
      (region === "intl" ? '<label><input type="checkbox" id="friendly"' + (u.friendly ? " checked" : "") + '> فقط مناسب ایرانی‌ها</label>' : "") +
      "</div>";
    var note = region === "intl"
      ? '<div class="note">بیشترِ سایت‌های کاریابی خارجی احراز هویت یا اقامت می‌خواهند. LinkedIn، پروژه‌های فریلنس و آگهی‌های مرتبط با ایران شانس بیشتری دارند؛ تیک «فقط مناسب ایرانی‌ها» همین‌ها را نشان می‌دهد.</div>'
      : "";
    var list = rows.length ? '<div class="list">' + rows.map(cardHtml).join("") + "</div>"
      : '<div class="empty">فرصتی با این فیلترها نیست. حداقل امتیاز را کم کنید یا تیک «فیلترهای من» را بردارید.</div>';
    return bar + note + list;
  }

  function scoreCls(s) { return s >= 55 ? "hi" : s >= 40 ? "mid" : ""; }

  function cardHtml(o) {
    var st = statusOf(o.id), n = notesOf(o.id);
    var why = (o.reasons || []).slice(0, 6).map(function (r) {
      var c = r.charAt(0) === "✗" ? "neg" : r.charAt(0) === "⚠" ? "" : "why";
      return '<span class="tag ' + c + '" dir="ltr">' + esc(r) + "</span>";
    }).join("");

  // ------------------------------------------------------------- actions
  function lines(id) { return ($(id).value || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean); }

  async function setStatus(id, st) {
    var prev = S.status[id];
    var next = st === statusOf(id) ? "New" : st;
    S.status[id] = { status: next, notes: notesOf(id), at: new Date().toISOString() };
    renderAll();
    if (!S.db) return;
    try { await S.db.doc("status/" + id).set(S.status[id]); }
    catch (e) { S.status[id] = prev; renderAll(); toast("ذخیره نشد؛ دوباره امتحان کنید."); }
  }

  async function saveNotes(id) {
    var ta = $("n-" + id); if (!ta) return;
    S.status[id] = { status: statusOf(id), notes: ta.value.trim(), at: new Date().toISOString() };
    renderAll();
    if (S.db) { try { await S.db.doc("status/" + id).set(S.status[id]); toast("یادداشت ذخیره شد"); } catch (e) { toast("یادداشت ذخیره نشد."); } }
  }

  async function saveDoc(path, data, msgId, okText) {
    var m = $(msgId);
    if (!S.db) { if (m) { m.className = "msg err"; m.textContent = "ذخیره‌سازی در این نما در دسترس نیست."; } return; }
    try { await S.db.doc(path).set(data); if (m) { m.className = "msg ok"; m.textContent = okText; } }
    catch (e) { if (m) { m.className = "msg err"; m.textContent = "ذخیره نشد (" + (e && e.code || "خطا") + ")."; } }
  }

  function fill(tpl, o) { return tpl.split("{title}").join(o.title).split("{company}").join(o.company || (o.region === "iran" ? "مجموعه‌ی شما" : "your team")); }

  function openComposer(o) {
    var lang = o.region === "iran" ? "fa" : "en";
    var text = fill(S.templates[lang] || DEFAULT_TEMPLATES[lang], o);
    var subj = lang === "fa" ? "درخواست همکاری — " + o.title : "Application — " + o.title;
    $("modalRoot").innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="متن درخواست">' +
      '<div class="acts" style="margin:0 0 8px"><b dir="auto">' + esc(o.title) + '</b><span class="spacer"></span><button type="button" class="btn small ghost" data-act="close">بستن</button></div>' +
      '<div class="field">موضوع<input id="cSubj" dir="auto" value="' + esc(subj) + '"></div>' +
      '<div class="field">متن<textarea id="cText" dir="' + (lang === "fa" ? "rtl" : "ltr") + '">' + esc(text) + "</textarea></div>" +
      '<div class="field">ایمیل کارفرما (اگر در آگهی هست)<input id="cTo" dir="ltr" value="' + esc(o.email || "") + '" placeholder="hr@company.com"></div>' +
      '<div class="acts">' +
      '<button type="button" class="btn" data-act="copy">کپی متن</button>' +
      '<button type="button" class="btn" data-act="ai" id="aiBtn" hidden>شخصی‌سازی با Claude</button>' +
      '<button type="button" class="btn primary" data-act="draft" id="draftBtn" hidden>ساخت پیش‌نویس در Gmail</button>' +
      '<span class="spacer"></span><a class="btn ghost" href="' + esc(o.url) + '" target="_blank" rel="noopener">باز کردن آگهی</a>' +
      '</div><div class="msg" id="cMsg">بیشتر سایت‌های ایرانی ارسال رزومه را فقط داخل خود سایت قبول می‌کنند: متن را کپی کنید، آگهی را باز کنید و در فرم سایت بچسبانید.</div>' +
      "</div></div>";
    $("modalRoot").dataset.id = o.id;
    if (caps.sample) $("aiBtn").hidden = false;
    if (caps.mcp) $("draftBtn").hidden = false;
  }

  async function copyText() {
    var ta = $("cText"), m = $("cMsg");
    try { await navigator.clipboard.writeText(ta.value); m.className = "msg ok"; m.textContent = "متن کپی شد. حالا آگهی را باز کنید و در فرم درخواست بچسبانید."; }
    catch (e) { ta.focus(); ta.select(); m.className = "msg"; m.textContent = "متن انتخاب شد؛ با Ctrl+C یا Cmd+C کپی کنید."; }
  }

  var aiCtl = null;
  async function personalize(o) {
    var sample = caps.sample, ta = $("cText"), m = $("cMsg"), b = $("aiBtn");
    if (!sample) return;
    if (aiCtl) { aiCtl.abort(); return; }
    aiCtl = new AbortController(); b.textContent = "توقف"; m.className = "msg"; m.textContent = "Claude در حال نوشتن…";
    var lang = o.region === "iran" ? "Persian (Farsi)" : "English";
    var prompt = "Rewrite this job application message so it fits the specific posting. Keep it short (at most 130 words), warm and professional, in " + lang +
      ". Mention 2-3 of the applicant's skills that match the posting. Keep the placeholders in square brackets exactly as they are. Reply with only the message text.\n\n" +
      "Posting title: " + o.title + "\nCompany: " + (o.company || "-") + "\nLocation: " + (o.location || "-") + "\nPosting summary: " + (o.desc || "-") +
      "\nWhy it matched: " + (o.reasons || []).join(", ") + "\n\nApplicant's base message:\n" + ta.value.slice(0, 4000);
    try {
      await sample(prompt, { signal: aiCtl.signal, cache: false, onText: function (u) { ta.value = u.text; } });
      m.className = "msg ok"; m.textContent = "متن شخصی‌سازی شد. قبل از ارسال یک بار بخوانید.";
    } catch (e) {
      if (e && e.text) ta.value = e.text;
      var copy = { cancelled: "متوقف شد.", not_granted: "اجازه‌ی استفاده از Claude داده نشد.", rate_limited: "کمی بعد دوباره امتحان کنید.", sampling_disabled: "Claude برای این حساب در دسترس نیست." };
      m.className = "msg" + (e && e.code === "cancelled" ? "" : " err"); m.textContent = copy[e && e.code] || "نوشتن متن کامل نشد؛ دوباره امتحان کنید.";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { b.hidden = true; caps.sample = null; }
    } finally { aiCtl = null; b.textContent = "شخصی‌سازی با Claude"; }
  }

  function b64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1] || ""); }; r.onerror = rej; r.readAsDataURL(blob);
    });
  }

  async function makeDraft(o) {
    var mcp = caps.mcp, m = $("cMsg"), btn = $("draftBtn");
    var to = ($("cTo").value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { m.className = "msg err"; m.textContent = "ایمیل کارفرما را وارد کنید (مثلا hr@company.com)."; return; }
    btn.disabled = true; m.className = "msg"; m.textContent = "در حال ساخت پیش‌نویس…";
    var input = { to: [to], subject: $("cSubj").value, body: $("cText").value };
    var attached = false;
    if (S.resume) {
      try {
        var blob = await (await fetch("/_blob/" + S.resume.assetId)).blob();
        var lt = await mcp.listTools().catch(function () { return null; });
        var type = S.resume.type || "application/pdf";
        if (lt && lt.fileArgs) { input.attachments = [{ content: { $file: { data: blob, name: S.resume.name, type: type } }, filename: S.resume.name, mimeType: type }]; attached = true; }
        else if (blob.size < 700000) { input.attachments = [{ content: await b64(blob), filename: S.resume.name, mimeType: type }]; attached = true; }
      } catch (e) { attached = false; }
    }
    try {
      var r = await mcp.callTool("Gmail", "create_draft", input);
      var p = r && r.payload, url = p && (p.viewUrl || (p.draft && p.draft.viewUrl));
      m.className = "msg ok";
      m.innerHTML = "پیش‌نویس در Gmail ساخته شد" + (attached ? " (رزومه پیوست است)" : S.resume ? " (رزومه پیوست نشد؛ در Gmail اضافه کنید)" : "") +
        ". بعد از بازبینی، خودتان در Gmail ارسالش کنید." + (url ? ' <a href="' + esc(url) + '" target="_blank" rel="noopener">باز کردن پیش‌نویس</a>' : "");
      setStatusQuiet(o.id, "Contacted");
    } catch (e) {
      var codes = {
        needs_reauth: "اتصال Gmail منقضی شده؛ در claude.ai بخش Settings و بعد Connectors دوباره وصلش کنید.",
        server_not_connected: "Gmail به حساب Claude وصل نیست؛ از Settings و بعد Connectors اضافه‌اش کنید.",
        not_in_manifest: "اجازه‌ی Gmail برای این صفحه داده نشد.",
        tool_error: "Gmail پیش‌نویس را نساخت: " + (e && e.message || "")
      };
      m.className = "msg err"; m.textContent = codes[e && e.code] || "ساخت پیش‌نویس انجام نشد؛ کمی بعد دوباره امتحان کنید.";
    } finally { btn.disabled = false; }
  }
  async function setStatusQuiet(id, st) {
    if (statusOf(id) === st) return;
    S.status[id] = { status: st, notes: notesOf(id), at: new Date().toISOString() };
    renderAll();
    if (S.db) { try { await S.db.doc("status/" + id).set(S.status[id]); } catch (e) {} }
  }

  async function uploadResume(file) {
    var m = $("resumeMsg");
    if (!caps.assets) { m.className = "msg err"; m.textContent = "بارگذاری فایل در این نما در دسترس نیست."; return; }
    if (!/pdf$/i.test(file.type || file.name)) { m.className = "msg err"; m.textContent = "فقط فایل PDF. فایل Word را اول به PDF تبدیل کنید."; return; }
    m.className = "msg"; m.textContent = "در حال بارگذاری…";
    try {
      var r = await caps.assets.upload(file, { type: "application/pdf" });
      var doc = { assetId: r.id, name: file.name, type: r.contentType, size: r.sizeBytes, at: new Date().toISOString() };
      await S.db.doc("config/resume").set(doc);
      S.resume = doc; renderView(); toast("رزومه ذخیره شد");
    } catch (e) {
      var copy = { too_large: "فایل بزرگ‌تر از ۲۰ مگابایت است.", unsupported_type: "این نوع فایل پذیرفته نمی‌شود؛ PDF بدهید.", quota_or_state: "فضای ذخیره پر است." };
      m.className = "msg err"; m.textContent = copy[e && e.code] || "بارگذاری نشد؛ دوباره امتحان کنید.";
    }
  }

  var scanArmed = false;
  async function scanNow() {
    var b = $("scanBtn"), m = $("scanMsg");
    var last = Number(ls("scanAt", "0"));
    if (Date.now() - last < 30 * 60e3) { m.className = "msg"; m.textContent = "اسکن اخیرا درخواست شده؛ نتایج حدود ۱۰ دقیقه بعد می‌آید."; return; }
    if (!scanArmed) { scanArmed = true; b.textContent = "تأیید: اسکن شروع شود؟"; m.textContent = "از سهمیه‌ی Claude شما استفاده می‌کند."; setTimeout(function () { scanArmed = false; b.textContent = "اسکن الان"; }, 6000); return; }
    scanArmed = false; b.disabled = true; b.textContent = "در حال درخواست…";
    try {
      await caps.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER_ID });
      lsSet("scanAt", String(Date.now()));
      m.className = "msg ok"; m.textContent = "اسکن شروع شد؛ نتایج حدود ۱۰ دقیقه بعد همین‌جا و در ایمیل می‌آید.";
    } catch (e) {
      m.className = "msg err";
      m.textContent = e && e.code === "not_in_manifest" ? "اجازه‌ی اجرای اسکن برای این صفحه داده نشد." : "اسکن شروع نشد؛ کمی بعد دوباره امتحان کنید.";
    } finally { b.disabled = false; b.textContent = "اسکن الان"; }
  }

  // -------------------------------------------------------------- events
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab],[data-act]");
    if (!t) { if (ev.target.id === "ov") $("modalRoot").innerHTML = ""; return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; lsSet("tab", S.tab); renderTabs(); renderView(); return; }
    var act = t.dataset.act, card = t.closest(".card"), id = card && card.dataset.id;
    var modalId = $("modalRoot").dataset.id, mo = modalId && S.items[modalId];
    if (act === "status") setStatus(id, t.dataset.st);
    else if (act === "notes") { var n = card.querySelector("[data-notes]"); n.hidden = !n.hidden; if (!n.hidden) n.querySelector("textarea").focus(); }
    else if (act === "saveNotes") saveNotes(id);
    else if (act === "compose") openComposer(S.items[id]);
    else if (act === "close") $("modalRoot").innerHTML = "";
    else if (act === "copy") copyText();
    else if (act === "ai" && mo) personalize(mo);
    else if (act === "draft" && mo) makeDraft(mo);
    else if (act === "saveTemplates") { S.templates = { fa: $("tplFa").value, en: $("tplEn").value }; saveDoc("config/templates", S.templates, "tplMsg", "متن‌ها ذخیره شد."); }
    else if (act === "resetTemplates") { S.templates = clone(DEFAULT_TEMPLATES); renderView(); }
    else if (act === "saveFilters") {
      var types = []; if ($("fJob").checked) types.push("job"); if ($("fFree").checked) types.push("freelance");
      S.filters = { mustAny: lines("fMust"), exclude: lines("fEx"), cities: lines("fCity"), remoteOnly: $("fRemote").checked, types: types, minScore: Number($("fMin").value) || 0 };
      saveDoc("config/filters", S.filters, "fMsg", "فیلترها ذخیره شد و روی لیست‌ها اعمال می‌شود."); renderTabs(); renderSummary();
    }
    else if (act === "clearFilters") { S.filters = clone(DEFAULT_FILTERS); renderView(); saveDoc("config/filters", S.filters, "fMsg", "همه‌ی فیلترها پاک شد."); renderTabs(); }
  });
  $("scanBtn").addEventListener("click", scanNow);

  var qTimer = null;
  document.addEventListener("input", function (ev) {
    var id = ev.target.id;
    if (id === "q") { clearTimeout(qTimer); qTimer = setTimeout(function () { S.ui.q = ev.target.value; refreshList(); }, 200); }
    if (id === "minScore") { S.ui.minScore = Number(ev.target.value) || 0; refreshList(); }
  });
  document.addEventListener("change", function (ev) {
    var id = ev.target.id;
    if (["type", "mode", "days", "st", "sort"].indexOf(id) > -1) { S.ui[id] = ev.target.value; refreshList(); }
    if (id === "mine") { S.ui.mine = ev.target.checked; lsSet("mine", S.ui.mine ? "1" : "0"); refreshList(); }
    if (id === "friendly") { S.ui.friendly = ev.target.checked; lsSet("friendly", S.ui.friendly ? "1" : "0"); refreshList(); }
    if (id === "resumeFile" && ev.target.files[0]) uploadResume(ev.target.files[0]);
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") $("modalRoot").innerHTML = ""; });

  // keep the search box and its caret while the list re-renders
  function refreshList() {
    var region = S.tab; if (region !== "iran" && region !== "intl") return;
    var list = $("view").querySelector(".list, .empty");
    var tmp = document.createElement("div"); tmp.innerHTML = feedHtml(region);
    var fresh = tmp.querySelector(".list, .empty");
    if (list && fresh) list.replaceWith(fresh); else renderView();
    renderTabs();
  }

  // ---------------------------------------------------------------- boot
  var caps = { db: null, mcp: null, sample: null, assets: null };
  renderAll();

  (async function boot() {
    if (!window.claude || !window.claude.use) { S.loaded = true; $("view").innerHTML = '<div class="empty">این صفحه فقط داخل Claude داده‌ها را نشان می‌دهد.</div>'; renderHeader(); return; }
    var db = await window.claude.use("db");
    caps.db = S.db = db;
    if (!db) { S.loaded = true; $("view").innerHTML = '<div class="empty">پایگاه داده در این نما در دسترس نیست. صفحه را از داخل claude.ai باز کنید.</div>'; renderHeader(); return; }
    var pending = 2, done = function () { if (--pending <= 0) { S.loaded = true; renderAll(); } };
    var failed = function () { S.loaded = true; $("view").innerHTML = '<div class="empty">اتصال به داده‌ها قطع شد؛ صفحه را دوباره باز کنید.</div>'; };
    db.collection("feed").onSnapshot(function (snap) {
      var items = {};
      snap.docs.forEach(function (d) { var b = d.data() || {}; (b.items || []).forEach(function (o) { if (o && o.id) items[o.id] = o; }); });
      S.items = items; if (S.loaded) renderAll(); else done();
    }, failed);
    db.collection("status").onSnapshot(function (snap) {
      var st = {}; snap.docs.forEach(function (d) { st[d.id] = d.data() || {}; });
      S.status = st; if (S.loaded) { renderSummary(); renderTabs(); if (S.tab === "iran" || S.tab === "intl") refreshList(); else if (S.tab === "pipe") renderView(); } else done();
    }, failed);
    db.doc("config/meta").onSnapshot(function (d) { S.meta = d.exists ? d.data() : null; renderHeader(); });
    db.doc("config/filters").onSnapshot(function (d) {
      if (d.exists) { var f = d.data(); S.filters = { mustAny: f.mustAny || [], exclude: f.exclude || [], cities: f.cities || [], remoteOnly: !!f.remoteOnly, types: f.types || [], minScore: f.minScore || 0 }; }
      if (S.loaded && S.tab !== "filters" && S.tab !== "texts") { renderTabs(); renderView(); }
    });
    db.doc("config/templates").onSnapshot(function (d) { if (d.exists) { var t = d.data(); S.templates = { fa: t.fa || DEFAULT_TEMPLATES.fa, en: t.en || DEFAULT_TEMPLATES.en }; } });
    db.doc("config/resume").onSnapshot(function (d) { S.resume = d.exists ? d.data() : null; if (S.loaded && S.tab === "texts") renderView(); });

    window.claude.use("sample").then(function (s) { caps.sample = s; });
    window.claude.use("assets").then(function (a) { caps.assets = a; });
    window.claude.use("mcp").then(function (m) { caps.mcp = m; if (m) $("scanBtn").hidden = false; });
  })();
})();
</script>

<title>رادار فرصت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<style>
/* Single light theme by design (the owner asked for a white dashboard). */
:root{
  color-scheme:light;
  --bg:#ffffff; --plane:#f6f7fb; --plane2:#eef0f7; --card:#ffffff;
  --ink:#0f1222; --ink2:#3d4260; --muted:#737897; --faint:#a3a7c0;
  --line:#e8e9f2; --line2:#dfe1ee;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef0ff; --accent-line:#d9dcff;
  --good:#12803a; --good-soft:#e5f6ec; --warn:#a15c07; --warn-soft:#fdf2df; --bad:#c2352b; --bad-soft:#fdeceb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --o1:#86b6ef; --o2:#3987e5; --o3:#256abf; --o4:#104281;
  --radius:16px; --radius-s:10px;
  --shadow-s:0 1px 2px rgba(15,18,34,.04);
  --shadow:0 1px 2px rgba(15,18,34,.04),0 8px 24px -12px rgba(15,18,34,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.7;direction:rtl;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--plane);border-inline-start:0;border-inline-end:1px solid var(--line);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#5b52f0,#3f36c9);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.3}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;color:var(--faint);letter-spacing:.04em;padding:12px 12px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:9px 12px;color:var(--ink2);font-weight:500;text-align:start;width:100%}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--plane2)}
.nav button.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:var(--shadow-s),inset 0 0 0 1px var(--line)}
.nav .cnt{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--plane2);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.nav button.on .cnt{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-inline-end:6px;vertical-align:middle}

.main{min-width:0;padding-inline:32px;padding-block:22px 64px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .crumb{font-size:12.5px;color:var(--muted)}
.topbar .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--plane);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0;flex:0 1 320px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{border:0;background:none;outline:none;min-width:0;width:100%;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:10px;z-index:5;border-inline-end:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.nav .grp,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav button .lbl-long{display:none}
  .main{padding-inline:16px}
}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-s)}
.panel h2{font-size:15px;font-weight:700;margin:0}
.panel .sub{font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.phead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.25fr 1fr}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.g-hero,.g-2,.g-3{grid-template-columns:1fr}}

/* hero */
.hero{background:linear-gradient(135deg,#f3f2ff 0%,#fbfbff 55%,#ffffff 100%);border:1px solid var(--accent-line);border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(79,70,229,.10),rgba(79,70,229,0) 70%)}
.hero .eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.hero .fig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .fig b{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.hero .fig span{font-size:16px;color:var(--ink2);font-weight:600}
.hero p{margin:0;color:var(--ink2);max-width:52ch}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-size:26px;font-weight:800;letter-spacing:-.01em}
.tile .hint{font-size:12px;color:var(--muted)}
.tile .hint.up{color:var(--good)}

/* charts (HTML bars) */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);align-items:center;gap:10px;font-size:13px}
.hb .k{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hb .track{position:relative;height:22px;display:flex;align-items:center;gap:8px}
.hb .bar{height:14px;border-radius:4px 0 0 4px;background:var(--s1);min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hb .v{font-size:12.5px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb[data-tip]{cursor:default}
.hb:hover .bar{filter:brightness(.92)}
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;margin:6px 0 12px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-weight:700;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:8px}
.fs{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:13px}
.fs .bar{height:18px;border-radius:4px 0 0 4px;min-width:4px}
.fs .v{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.chart-empty{font-size:13px;color:var(--muted);padding:18px 0}
.tip{position:fixed;z-index:30;pointer-events:none;background:#0f1222;color:#fff;font-size:12.5px;border-radius:8px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:260px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--plane);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:4px 12px;font-size:13px;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow-s),inset 0 0 0 1px var(--line)}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);background:var(--plane);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.ctl select,.ctl input[type=number]{border:0;background:none;outline:none;font-size:13px;font-weight:600;color:var(--ink)}
.ctl input[type=range]{accent-color:var(--accent);width:110px}
.ctl output{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;min-width:2ch}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{inset-inline-start:16px}
.result{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:#6f4205;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;margin-top:2px}

/* ---------- opportunity rows ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.opp{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opp:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.opp.dim{opacity:.5}
.ring{width:52px;height:52px;position:relative;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.opp h3{font-size:15px;font-weight:700;margin:0;line-height:1.6;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted);margin-top:1px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--plane);color:var(--ink2);white-space:nowrap}
.chip.skill{background:var(--good-soft);color:var(--good)}
.chip.neg{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.side-acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--plane);color:var(--ink2);white-space:nowrap}
.pill.New{background:var(--accent-soft);color:var(--accent)}
.pill.Saved{background:#e6f0fc;color:#1f5fae}
.pill.Contacted,.pill.Applied{background:var(--warn-soft);color:var(--warn)}
.pill.Won{background:var(--good-soft);color:var(--good)}
.pill.Rejected,.pill.Ignored{background:var(--plane2);color:var(--muted)}
.qa{display:flex;gap:4px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-line)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.opp{grid-template-columns:52px minmax(0,1fr)}.side-acts{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.t th{background:var(--plane);color:var(--muted);font-weight:600;font-size:12px;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr{cursor:pointer}
table.t tr:hover td{background:#fafaff}
table.t .num{font-variant-numeric:tabular-nums;font-weight:700}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:14px}

/* ---------- kanban ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--plane);border-radius:14px;padding:12px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.lane h3{margin:0 0 4px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.lane h3 i{width:8px;height:8px;border-radius:50%}
.lane h3 span{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;cursor:pointer}
.kcard:hover{border-color:var(--accent-line)}
.kcard b{display:block;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.kcard .m{font-size:12px;color:var(--muted)}
.kcard .mv{display:flex;gap:4px;margin-top:6px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,18,34,.32);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--card);z-index:21;box-shadow:0 0 40px rgba(15,18,34,.18);transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dhead{display:flex;gap:14px;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:17px;margin:0;line-height:1.55;overflow-wrap:anywhere}
.dbody{padding:16px 22px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.sec h4{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 8px;letter-spacing:.02em}
.desc{font-size:13.5px;color:var(--ink2);white-space:pre-wrap;background:var(--plane);border-radius:12px;padding:12px 14px}
.stgrid{display:flex;flex-wrap:wrap;gap:6px}
textarea.in,input.in{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:9px 12px;font-size:14px;resize:vertical;outline:none}
textarea.in:focus,input.in:focus{border-color:var(--accent)}
.msg{font-size:12.5px;color:var(--ink2);margin-top:6px}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.breakdown{display:flex;flex-direction:column;gap:6px}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2);font-weight:600}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.taginput{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:6px 8px;min-height:42px;background:var(--card)}
.taginput .t{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:1px 4px 1px 8px;font-size:12.5px;font-weight:600}
.taginput .t button{border:0;background:none;color:inherit;padding:0 4px;font-size:14px;line-height:1}
.taginput input{border:0;outline:none;flex:1;min-width:120px;font-size:13.5px;background:none}
.upload{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--accent-line);background:#fafaff;border-radius:14px;padding:16px}
.upload .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.upload .ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:420px;background:#0f1222;color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;z-index:40;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.skeleton{height:84px;border-radius:14px;background:linear-gradient(90deg,var(--plane) 0%,var(--plane2) 50%,var(--plane) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".45"/><circle cx="12" cy="12" r="5" opacity=".8"/><path d="M12 12 18.5 6.5"/><circle cx="12" cy="12" r="1.7" fill="#fff" stroke="none"/></svg></div>
      <div><b>رادار فرصت</b><span>سئو · جئو · دیجیتال مارکتینگ</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1 id="title">نمای کلی</h1><div class="crumb" id="crumb">در حال بارگذاری…</div></div>
      <div class="grow"></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="جستجو در همه‌ی فرصت‌ها…" aria-label="جستجو"></label>
      <button class="btn" id="scanBtn" type="button" hidden><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>اسکن الان</span></button>
    </div>
    <div id="view"><div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="جزئیات فرصت"></aside>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var TRIGGER_ID = "trig_01HhFw5wQq1oRaCsE3GEr7VZ";
  var STATUSES = ["New", "Saved", "Contacted", "Applied", "Won", "Rejected", "Ignored"];
  var STATUS_FA = { New: "جدید", Saved: "ذخیره‌شده", Contacted: "پیام دادم", Applied: "اپلای کردم", Won: "موفق", Rejected: "رد شد", Ignored: "نادیده" };

  function fill(tpl, o) { return tpl.split("{title}").join(o.title).split("{company}").join(o.company || (o.region === "iran" ? "مجموعه‌ی شما" : "your team")); }

  // ------------------------------------------------------------ actions
  async function writeStatus(id, next, note) {
    var prev = S.status[id];
    S.status[id] = { status: next, notes: note != null ? note : notesOf(id), at: new Date().toISOString() };
    render(); if (S.openId === id) openDrawer(id);
    if (!S.db) return;
    try { await S.db.doc("status/" + id).set(S.status[id]); }
    catch (e) { S.status[id] = prev; render(); toast("ذخیره نشد؛ دوباره امتحان کنید."); }
  }
  function toggleStatus(id, st) { writeStatus(id, statusOf(id) === st && S.view !== "pipe" ? "New" : st); }

  async function saveDoc(path, data, msgId, okText) {
    var m = $(msgId);
    if (!S.db) { if (m) { m.className = "msg err"; m.textContent = "ذخیره‌سازی در این نما در دسترس نیست."; } return; }
    try { await S.db.doc(path).set(data); if (m) { m.className = "msg ok"; m.textContent = okText; } }
    catch (e) { if (m) { m.className = "msg err"; m.textContent = "ذخیره نشد (" + (e && e.code || "خطا") + ")."; } }
  }

  async function copyText() {
    var ta = $("cText"), m = $("cMsg");
    try { await navigator.clipboard.writeText(ta.value); m.className = "msg ok"; m.textContent = "متن کپی شد. آگهی را باز کنید و در فرم درخواست بچسبانید."; }
    catch (e) { ta.focus(); ta.select(); m.className = "msg"; m.textContent = "متن انتخاب شد؛ با Ctrl+C یا Cmd+C کپی کنید."; }
  }

  var aiCtl = null;
  async function personalize(o) {
    var sample = caps.sample, ta = $("cText"), m = $("cMsg"), b = $("aiBtn");
    if (!sample || !b) return;
    if (aiCtl) { aiCtl.abort(); return; }
    aiCtl = new AbortController(); b.querySelector("span").textContent = "توقف"; m.className = "msg"; m.textContent = "Claude در حال نوشتن…";
    var lang = o.region === "iran" ? "Persian (Farsi)" : "English";
    var prompt = "Rewrite this job application message so it fits the specific posting. Keep it short (at most 130 words), warm and professional, in " + lang +
      ". Mention 2-3 of the applicant's skills that match the posting. Keep placeholders in square brackets exactly as they are. Reply with only the message text.\n\n" +
      "Posting title: " + o.title + "\nCompany: " + (o.company || "-") + "\nLocation: " + (o.location || "-") + "\nPosting summary: " + (o.desc || "-") +
      "\nWhy it matched: " + (o.reasons || []).join(", ") + "\n\nApplicant's base message:\n" + ta.value.slice(0, 4000);
    try {
      await sample(prompt, { signal: aiCtl.signal, cache: false, onText: function (u) { ta.value = u.text; } });
      m.className = "msg ok"; m.textContent = "متن شخصی‌سازی شد. قبل از ارسال یک بار بخوانید.";
    } catch (e) {
      if (e && e.text) ta.value = e.text;
      var copy = { cancelled: "متوقف شد.", not_granted: "اجازه‌ی استفاده از Claude داده نشد.", rate_limited: "کمی بعد دوباره امتحان کنید.", sampling_disabled: "Claude برای این حساب در دسترس نیست." };
      m.className = "msg" + (e && e.code === "cancelled" ? "" : " err"); m.textContent = copy[e && e.code] || "نوشتن متن کامل نشد؛ دوباره امتحان کنید.";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { caps.sample = null; b.hidden = true; }
    } finally { aiCtl = null; if (b.querySelector("span")) b.querySelector("span").textContent = "شخصی‌سازی با Claude"; }
  }

  function b64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1] || ""); }; r.onerror = rej; r.readAsDataURL(blob); }); }

  async function makeDraft(o) {
    var mcp = caps.mcp, m = $("cMsg"), btn = $("draftBtn");
    var to = ($("cTo").value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { m.className = "msg err"; m.textContent = "ایمیل کارفرما را وارد کنید (مثلا hr@company.com)."; return; }
    btn.disabled = true; m.className = "msg"; m.textContent = "در حال ساخت پیش‌نویس…";
    var input = { to: [to], subject: $("cSubj").value, body: $("cText").value }, attached = false;
    if (S.resume) {
      try {
        var blob = await (await fetch("/_blob/" + S.resume.assetId)).blob();
        var lt = await mcp.listTools().catch(function () { return null; });
        var type = S.resume.type || "application/pdf";
        if (lt && lt.fileArgs) { input.attachments = [{ content: { $file: { data: blob, name: S.resume.name, type: type } }, filename: S.resume.name, mimeType: type }]; attached = true; }
        else if (blob.size < 700000) { input.attachments = [{ content: await b64(blob), filename: S.resume.name, mimeType: type }]; attached = true; }
      } catch (e) { attached = false; }
    }
    try {
      var r = await mcp.callTool("Gmail", "create_draft", input);
      var p = r && r.payload, url = p && (p.viewUrl || (p.draft && p.draft.viewUrl));
      m.className = "msg ok";
      m.innerHTML = "پیش‌نویس در Gmail ساخته شد" + (attached ? " (رزومه پیوست است)" : S.resume ? " (رزومه پیوست نشد؛ در Gmail اضافه کنید)" : "") +
        ". بعد از بازبینی، خودتان در Gmail ارسالش کنید." + (url ? ' <a href="' + esc(url) + '" target="_blank" rel="noopener">باز کردن پیش‌نویس</a>' : "");
      if (statusOf(o.id) === "New" || statusOf(o.id) === "Saved") writeStatus(o.id, "Contacted");
    } catch (e) {
      var codes = {
        needs_reauth: "اتصال Gmail منقضی شده؛ در claude.ai بخش Settings و بعد Connectors دوباره وصلش کنید.",
        server_not_connected: "Gmail به حساب Claude وصل نیست؛ از Settings و بعد Connectors اضافه‌اش کنید.",
        not_in_manifest: "اجازه‌ی Gmail برای این صفحه داده نشد.",
        tool_error: "Gmail پیش‌نویس را نساخت: " + (e && e.message || "")
      };
      m.className = "msg err"; m.textContent = codes[e && e.code] || "ساخت پیش‌نویس انجام نشد؛ کمی بعد دوباره امتحان کنید.";
    } finally { if (btn) btn.disabled = false; }
  }

  async function uploadResume(file) {
    var m = $("resumeMsg");
    if (!caps.assets) { m.className = "msg err"; m.textContent = "بارگذاری فایل در این نما در دسترس نیست."; return; }
    if (!/pdf$/i.test(file.type || file.name)) { m.className = "msg err"; m.textContent = "فقط فایل PDF. فایل Word را اول به PDF تبدیل کنید."; return; }
    m.className = "msg"; m.textContent = "در حال بارگذاری…";
    try {
      var r = await caps.assets.upload(file, { type: "application/pdf" });
      var doc = { assetId: r.id, name: file.name, type: r.contentType, size: r.sizeBytes, at: new Date().toISOString() };
      await S.db.doc("config/resume").set(doc);
      S.resume = doc; renderView(); toast("رزومه ذخیره شد");
    } catch (e) {
      var copy = { too_large: "فایل بزرگ‌تر از ۲۰ مگابایت است.", unsupported_type: "این نوع فایل پذیرفته نمی‌شود؛ PDF بدهید.", quota_or_state: "فضای ذخیره پر است." };
      m.className = "msg err"; m.textContent = copy[e && e.code] || "بارگذاری نشد؛ دوباره امتحان کنید.";
    }
  }

  var scanArmed = false;
  async function scanNow() {
    var b = $("scanBtn"), lbl = b.querySelector("span");
    var last = Number(ls("scanAt", "0"));
    if (Date.now() - last < 30 * 60e3) { toast("اسکن اخیرا درخواست شده؛ نتایج حدود ۱۰ دقیقه بعد می‌آید."); return; }
    if (!scanArmed) { scanArmed = true; lbl.textContent = "تأیید اسکن"; toast("یک بار دیگر بزنید تا اسکن شروع شود (از سهمیه‌ی Claude استفاده می‌کند)."); setTimeout(function () { scanArmed = false; lbl.textContent = "اسکن الان"; }, 6000); return; }
    scanArmed = false; b.disabled = true; lbl.textContent = "در حال درخواست…";
    try {
      await caps.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER_ID });
      lsSet("scanAt", String(Date.now())); toast("اسکن شروع شد؛ نتایج حدود ۱۰ دقیقه بعد همین‌جا و در ایمیل می‌آید.");
    } catch (e) {
      toast(e && e.code === "not_in_manifest" ? "اجازه‌ی اجرای اسکن برای این صفحه داده نشد." : "اسکن شروع نشد؛ کمی بعد دوباره امتحان کنید.");
    } finally { b.disabled = false; lbl.textContent = "اسکن الان"; }
  }

  // ------------------------------------------------------------ events
  document.addEventListener("click", function (ev) {
    var el = ev.target;
    if (el.closest("[data-stop]")) return;
    var v = el.closest("[data-view]");
    if (v) { S.view = v.dataset.view; S.limit = PAGE; lsSet("view", S.view); render(); window.scrollTo(0, 0); return; }
    var seg = el.closest("[data-seg]");
    if (seg) { var k = seg.dataset.seg; S.ui[k] = seg.dataset.val; if (k === "layout") lsSet("layout", S.ui.layout); S.limit = PAGE; renderView(); return; }
    var un = el.closest("[data-untag]");
    if (un) { tagState[un.dataset.untag].splice(Number(un.dataset.i), 1); drawTags(un.closest("[data-tags]")); return; }
    var a = el.closest("[data-act]");
    if (a) {
      var act = a.dataset.act, host = a.closest("[data-open]"), id = host ? host.dataset.open : S.openId, o = id && S.items[id];
      ev.stopPropagation();
      if (act === "st" && id) toggleStatus(id, a.dataset.st);
      else if (act === "close") closeDrawer();
      else if (act === "more") { S.limit += PAGE; renderView(); }
      else if (act === "saveNotes" && S.openId) { writeStatus(S.openId, statusOf(S.openId), $("dNotes").value.trim()); toast("یادداشت ذخیره شد"); }
      else if (act === "copy") copyText();
      else if (act === "ai" && o) personalize(o);
      else if (act === "draft" && o) makeDraft(o);
      else if (act === "saveTemplates") { S.templates = { fa: $("tplFa").value, en: $("tplEn").value }; saveDoc("config/templates", S.templates, "tplMsg", "متن‌ها ذخیره شد."); }
      else if (act === "resetTemplates") { S.templates = clone(DEFAULT_TEMPLATES); renderView(); }
      else if (act === "saveFilters") {
        document.querySelectorAll("[data-taginput]").forEach(commitTag);
        var types = []; if ($("fJob").checked) types.push("job"); if ($("fFree").checked) types.push("freelance");
        S.filters = { mustAny: tagState.mustAny, exclude: tagState.exclude, cities: tagState.cities, remoteOnly: $("fRemote").checked, types: types, minScore: Number($("fMin").value) || 0 };
        saveDoc("config/filters", S.filters, "fMsg", "فیلترها ذخیره شد و روی لیست‌ها اعمال می‌شود."); renderNav();
      }
      else if (act === "clearFilters") { S.filters = clone(DEFAULT_FILTERS); renderView(); saveDoc("config/filters", S.filters, "fMsg", "همه‌ی فیلترها پاک شد."); }
      return;
    }
    var open = el.closest("[data-open]");
    if (open) { openDrawer(open.dataset.open); return; }
    if (el.id === "scrim") closeDrawer();
  });
  $("scanBtn").addEventListener("click", scanNow);

  function commitTag(input) {
    var key = input.dataset.taginput, val = input.value.trim().replace(/[،,]$/, "");
    if (val && tagState[key].indexOf(val) === -1) tagState[key].push(val);
    input.value = "";
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeDrawer();
    var t = ev.target;
    if (t.dataset && t.dataset.taginput && (ev.key === "Enter" || ev.key === "," || ev.key === "،")) {
      ev.preventDefault(); commitTag(t); var box = t.closest("[data-tags]"); drawTags(box); box.querySelector("input").focus();
    }
  });

  var qTimer = null;
  $("q").addEventListener("input", function (ev) {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      S.ui.q = ev.target.value; S.limit = PAGE;
      if (S.ui.q && S.view !== "iran" && S.view !== "intl") { S.view = "iran"; lsSet("view", "iran"); }
      render();
    }, 220);
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "minScore") { S.ui.minScore = Number(ev.target.value) || 0; $("minOut").textContent = n(S.ui.minScore); lsSet("minScore", String(S.ui.minScore)); clearTimeout(qTimer); qTimer = setTimeout(renderView, 120); }
  });
  document.addEventListener("change", function (ev) {
    var id = ev.target.id;
    if (["days", "st", "sort"].indexOf(id) > -1) { S.ui[id] = ev.target.value; S.limit = PAGE; renderView(); }
    if (id === "mine") { S.ui.mine = ev.target.checked; lsSet("mine", S.ui.mine ? "1" : "0"); renderView(); }
    if (id === "friendly") { S.ui.friendly = ev.target.checked; lsSet("friendly", S.ui.friendly ? "1" : "0"); renderView(); }
    if (id === "resumeFile" && ev.target.files[0]) uploadResume(ev.target.files[0]);
  });

  // chart tooltips
  var tip = $("tip");
  document.addEventListener("mousemove", function (ev) {
    var t = ev.target.closest && ev.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.dataset.tip; tip.hidden = false;
    var x = Math.min(window.innerWidth - tip.offsetWidth - 8, ev.clientX + 14), y = ev.clientY + 16;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
  });

  // ------------------------------------------------------------ boot
  render();
  (async function boot() {
    if (!window.claude || !window.claude.use) { S.loaded = true; $("view").innerHTML = '<div class="empty">این صفحه فقط داخل Claude داده‌ها را نشان می‌دهد.</div>'; renderTop(); return; }
    var db = await window.claude.use("db");
    caps.db = S.db = db;
    if (!db) { S.loaded = true; $("view").innerHTML = '<div class="empty">پایگاه داده در این نما در دسترس نیست. صفحه را از داخل claude.ai باز کنید.</div>'; renderTop(); return; }
    var pending = 2;
    function ready() { if (--pending <= 0 && !S.loaded) { S.loaded = true; render(); } }
    function failed() { S.loaded = true; $("view").innerHTML = '<div class="empty">اتصال به داده‌ها قطع شد؛ صفحه را دوباره باز کنید.</div>'; }
    function refresh() {
      if (!S.loaded) return;
      renderNav(); renderTop();
      var typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.id !== "q";
      if (!typing) renderView();
      if (S.openId && !typing) openDrawer(S.openId);
    }
    db.collection("feed").onSnapshot(function (snap) {
      var items = {};
      snap.docs.forEach(function (d) { var b = d.data() || {}; (b.items || []).forEach(function (o) { if (o && o.id) items[o.id] = o; }); });
      S.items = items; if (S.loaded) refresh(); else ready();
    }, failed);
    db.collection("status").onSnapshot(function (snap) {
      var st = {}; snap.docs.forEach(function (d) { st[d.id] = d.data() || {}; });
      S.status = st; if (S.loaded) refresh(); else ready();
    }, failed);
    db.doc("config/meta").onSnapshot(function (d) { S.meta = d.exists ? d.data() : null; renderNav(); renderTop(); });
    db.doc("config/filters").onSnapshot(function (d) {
      if (d.exists) { var f = d.data(); S.filters = { mustAny: f.mustAny || [], exclude: f.exclude || [], cities: f.cities || [], remoteOnly: !!f.remoteOnly, types: f.types || [], minScore: f.minScore || 0 }; }
      if (S.loaded && S.view !== "filters") refresh();
    });
    db.doc("config/templates").onSnapshot(function (d) { if (d.exists) { var t = d.data(); S.templates = { fa: t.fa || DEFAULT_TEMPLATES.fa, en: t.en || DEFAULT_TEMPLATES.en }; } });
    db.doc("config/resume").onSnapshot(function (d) { S.resume = d.exists ? d.data() : null; if (S.loaded && S.view === "texts") renderView(); });
    window.claude.use("sample").then(function (s) { caps.sample = s; });
    window.claude.use("assets").then(function (a) { caps.assets = a; });
    window.claude.use("mcp").then(function (m) { caps.mcp = m; if (m) $("scanBtn").hidden = false; });
  })();
})();
</script>
